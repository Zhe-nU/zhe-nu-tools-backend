services:
  backend:
    image: ghcr.io/zhe-nu/zhe-nu-tools-backend:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      - AVITO_CLIENT_ID=${AVITO_CLIENT_ID}
      - AVITO_CLIENT_SECRET=${AVITO_CLIENT_SECRET}
      - AVITO_WEBHOOK_BASE_URL=${AVITO_WEBHOOK_BASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - CLIENT_URL=${CLIENT_URL}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      - NODE_ENV=production
      - PORT=${PORT}

    ports:
      - '3000:3000'

  auth-migrate:
    image: ghcr.io/zhe-nu/zhe-nu-tools-backend-migrate:latest
    pull_policy: always
    command: npm run auth:migrate
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - CLIENT_URL=${CLIENT_URL}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NODE_ENV=production

  db-migrate:
    image: ghcr.io/zhe-nu/zhe-nu-tools-backend-migrate:latest
    pull_policy: always
    command: npm run db:migrate
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - CLIENT_URL=${CLIENT_URL}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NODE_ENV=production
