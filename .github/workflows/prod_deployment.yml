name: PROD

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

env:
  REGISTRY: ghcr.io
  IMAGE_APP: ghcr.io/zhe-nu/zhe-nu-tools-backend
  IMAGE_MIGRATE: ghcr.io/zhe-nu/zhe-nu-tools-backend-migrate

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/dockerfile.migrate
          push: true
          tags: ${{ env.IMAGE_MIGRATE }}:latest

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/dockerfile.prod
          push: true
          tags: ${{ env.IMAGE_APP }}:latest

  auth-migrate:
    needs: build-and-push
    runs-on: self-hosted

    environment: PROD

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run auth migrate
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

          AVITO_WEBHOOK_BASE_URL: ${{ vars.AVITO_WEBHOOK_BASE_URL }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          CLIENT_URL: ${{ vars.CLIENT_URL }}
          PORT: ${{ vars.PORT }}
        run: |
          docker compose -f ./.docker/docker-compose-prod.yaml pull auth-migrate
          docker compose -f ./.docker/docker-compose-prod.yaml run --rm auth-migrate

  migrate:
    needs: auth-migrate
    runs-on: self-hosted

    environment: PROD

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run db migrate
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

          AVITO_WEBHOOK_BASE_URL: ${{ vars.AVITO_WEBHOOK_BASE_URL }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          CLIENT_URL: ${{ vars.CLIENT_URL }}
          PORT: ${{ vars.PORT }}
        run: |
          docker compose -f ./.docker/docker-compose-prod.yaml pull db-migrate
          docker compose -f ./.docker/docker-compose-prod.yaml run --rm db-migrate

  deploy:
    needs: migrate
    runs-on: self-hosted

    environment: PROD

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy app
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

          AVITO_WEBHOOK_BASE_URL: ${{ vars.AVITO_WEBHOOK_BASE_URL }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          CLIENT_URL: ${{ vars.CLIENT_URL }}
          PORT: ${{ vars.PORT }}
        run: |
          docker compose -f ./.docker/docker-compose-prod.yaml pull backend
          docker compose -f ./.docker/docker-compose-prod.yaml up -d --no-build backend