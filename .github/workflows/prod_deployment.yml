  auth-migrate:
    runs-on: self-hosted

    environment: PROD

    steps:
      - uses: actions/checkout@v4

      - name: Migrate
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}

          AVITO_WEBHOOK_BASE_URL: ${{ vars.AVITO_WEBHOOK_BASE_URL }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          CLIENT_URL: ${{ vars.CLIENT_URL }}
          PORT: ${{ vars.PORT }}
        run: |
          docker compose -f ./.docker/docker-compose-prod.yaml run --rm --build auth-migrate

  migrate:
    needs: auth-migrate
    runs-on: self-hosted

    environment: PROD

    steps:
      - uses: actions/checkout@v4

      - name: Migrate
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}

          AVITO_WEBHOOK_BASE_URL: ${{ vars.AVITO_WEBHOOK_BASE_URL }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          CLIENT_URL: ${{ vars.CLIENT_URL }}
          PORT: ${{ vars.PORT }}
        run: |
          docker compose -f ./.docker/docker-compose-prod.yaml run --rm --build db-migrate

  build:
    needs: migrate
    runs-on: self-hosted

    environment: PROD

    steps:
      - uses: actions/checkout@v4

      - name: Build and Deploy
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

          AVITO_WEBHOOK_BASE_URL: ${{ vars.AVITO_WEBHOOK_BASE_URL }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          CLIENT_URL: ${{ vars.CLIENT_URL }}
          PORT: ${{ vars.PORT }}
        run: |
          docker compose -f ./.docker/docker-compose-prod.yaml up -d --build
